server.port=8081
spring.application.name=wefly

spring.datasource.url=jdbc:h2:mem:weflydb;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.h2.console.enabled=true
spring.h2.console.path=/bbdd

spring.jpa.show-sql=true
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect
spring.main.allow-circular-references=true

# Ordena los grupos (Tags) alfabética y numéricamente
springdoc.swagger-ui.tags-sorter=alpha

# Ordena las operaciones/endpoints dentro de cada grupo alfabéticamente por su ruta
springdoc.swagger-ui.operations-sorter=alpha